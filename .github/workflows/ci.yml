name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node20-

      - name: Preflight network/cache mode
        shell: bash
        run: |
          set -euo pipefail
          if getent hosts registry.npmjs.org >/dev/null 2>&1; then
            echo "dns_ok=true" >> "$GITHUB_ENV"
            echo "npm_config_prefer_offline=true" >> "$GITHUB_ENV"
            echo "npm_config_audit=false" >> "$GITHUB_ENV"
            echo "npm_config_fund=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "dns_ok=false" >> "$GITHUB_ENV"

          if [[ "${{ steps.npm-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "DNS for registry.npmjs.org is unavailable and npm cache is missing. Cannot run npm ci offline." >&2
            exit 1
          fi

          echo "npm_config_offline=true" >> "$GITHUB_ENV"
          echo "npm_config_audit=false" >> "$GITHUB_ENV"
          echo "npm_config_fund=false" >> "$GITHUB_ENV"

      - name: Install dependencies (root)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm ci --workspaces --include-workspace-root
          RC=$?
          set -e
          if [[ "$RC" -ne 0 ]]; then
            if grep -Rqs "code EUSAGE" "$HOME/.npm/_logs" 2>/dev/null; then
              echo "npm ci failed with EUSAGE (package-lock/package metadata mismatch)." >&2
              echo "Refresh package-lock.json in branch and rerun CI." >&2
            fi
            exit "$RC"
          fi

      - name: Verify build tooling in workspaces
        shell: bash
        run: |
          set -euo pipefail
          npm ls next --workspace=apps/gov-manager
          npm ls next --workspace=apps/web-portal
          npm ls astro --workspace=apps/web-public

      - name: GOV Manager Canonical Transition Gate
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck --workspace=apps/gov-manager
          npm run test --workspace=apps/gov-manager -- canonical-transition-e2e transition-validator

      - name: Build workspaces (no turbo dependency)
        shell: bash
        run: |
          set -euo pipefail
          npm run build --workspaces --if-present
