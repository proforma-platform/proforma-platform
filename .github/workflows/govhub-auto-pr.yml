name: GOVHUB Auto PR

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "refactor/**"
      - "perf/**"
      - "test/**"
      - "ci/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR token state
        id: token_state
        env:
          GOVHUB_PR_TOKEN: ${{ secrets.GOVHUB_PR_TOKEN }}
        run: |
          if [ -n "${GOVHUB_PR_TOKEN:-}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice when GOVHUB_PR_TOKEN is missing
        if: ${{ steps.token_state.outputs.has_token != 'true' }}
        run: |
          echo "GOVHUB_PR_TOKEN ausente. Usando fallback com GITHUB_TOKEN para nao interromper o ciclo."
          echo "Configure o secret GOVHUB_PR_TOKEN para manter autoria dedicada do bot de PR."

      - name: Create or reuse PR to main
        id: create_with_pat
        if: ${{ steps.token_state.outputs.has_token == 'true' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GOVHUB_PR_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');

            if (!branch || branch === 'main' || branch.startsWith('dependabot/')) {
              core.info(`Skip branch: ${branch}`);
              return;
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base: 'main',
              per_page: 1
            });

            if (existing.data.length > 0) {
              core.info(`PR already open: #${existing.data[0].number}`);
              return;
            }

            const headCommitMessage = String(context.payload?.head_commit?.message || '').trim();
            const title = headCommitMessage
              ? headCommitMessage.split('\n')[0].slice(0, 120)
              : `chore: auto pr ${branch}`;

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: 'main',
              title,
              body: [
                'Auto-opened by GOVHUB Auto PR workflow.',
                '',
                `- Branch: \`${branch}\``,
                '- Mode: GOVHUB governance auto cycle'
              ].join('\n')
            });

            core.info(`Created PR #${pr.data.number}`);

      - name: Fallback create/reuse PR with GITHUB_TOKEN
        if: ${{ steps.token_state.outputs.has_token != 'true' || steps.create_with_pat.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');

            if (!branch || branch === 'main' || branch.startsWith('dependabot/')) {
              core.info(`Skip branch: ${branch}`);
              return;
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base: 'main',
              per_page: 1
            });

            if (existing.data.length > 0) {
              core.info(`PR already open: #${existing.data[0].number}`);
              return;
            }

            const headCommitMessage = String(context.payload?.head_commit?.message || '').trim();
            const title = headCommitMessage
              ? headCommitMessage.split('\n')[0].slice(0, 120)
              : `chore: auto pr ${branch}`;

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: 'main',
              title,
              body: [
                'Auto-opened by GOVHUB Auto PR workflow (fallback token).',
                '',
                `- Branch: \`${branch}\``,
                '- Mode: GOVHUB governance auto cycle'
              ].join('\n')
            });

            core.info(`Created PR #${pr.data.number} via fallback.`);
