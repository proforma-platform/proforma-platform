name: GOVHUB Auto Approve

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    concurrency:
      group: govhub-auto-approve-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Evaluate PR criteria
        id: evaluate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const eventName = String(context.eventName || '');
            core.setOutput('event_name', eventName);
            if (eventName !== 'pull_request' || !context.payload.pull_request) {
              core.notice(`Unsupported event for review automation: ${eventName || 'unknown'}`);
              core.setOutput('approve', 'false');
              core.setOutput('reason', 'invalid_event');
              core.setOutput('pr_number', '');
              core.setOutput('head_sha', '');
              return;
            }

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            core.setOutput('pr_number', String(pull_number));

            const restrictedPathRegex = [
              /^infra\//,
              /^docker-compose/,
              /^nginx\//,
              /^cloudflare\//,
              /^\.github\/workflows\//,
              /^\.github\//,
              /^.*\.pem$/,
              /^.*\.key$/,
              /^secrets/i,
              /^\.env/,
            ];

            const titlePrefixRegex = /^(docs|chore|fix|feat|govhub|ci|refactor|perf|test)(\(|:)/i;
            const secretRegex = /(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36,}|xox[baprs]-[A-Za-z0-9-]{10,}|(?<![A-Za-z0-9])(password|secret|token)\s*[:=]\s*['\"]?[A-Za-z0-9_\-\/+=]{8,})/i;

            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            const title = pr.data.title || '';
            const headSha = pr.data.head.sha;
            core.setOutput('head_sha', String(headSha || ''));

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const changedPaths = files.map((f) => f.filename);
            const touchesRestricted = changedPaths.some((p) => {
              if (p === '.github/workflows/govhub-auto-approve.yml') return false;
              return restrictedPathRegex.some((rx) => rx.test(p));
            });

            if (touchesRestricted) {
              core.notice('Restricted path changed. Auto-approval skipped.');
              core.setOutput('approve', 'false');
              core.setOutput('reason', 'restricted_path');
              return;
            }

            for (const f of files) {
              if (!f.patch) continue;
              const added = f.patch
                .split('\n')
                .filter((line) => line.startsWith('+') && !line.startsWith('+++'))
                .map((line) => line.slice(1));
              for (const line of added) {
                if (secretRegex.test(line)) {
                  core.setFailed(`Security violation: potential secret pattern in ${f.filename}`);
                  return;
                }
              }
            }

            const hasValidTitle = titlePrefixRegex.test(title);
            if (!hasValidTitle) {
              core.notice('Title prefix invalid. Auto-approval skipped.');
              core.setOutput('approve', 'false');
              core.setOutput('reason', 'invalid_title');
              return;
            }

            const totalChangedLines = files.reduce((acc, f) => acc + (f.changes || 0), 0);
            if (totalChangedLines > 1000) {
              core.notice('Soft limit exceeded (>1000 changed lines). Auto-approval skipped.');
              core.setOutput('approve', 'false');
              core.setOutput('reason', 'too_many_changes');
              return;
            }

            core.setOutput('approve', 'true');
            core.setOutput('reason', 'eligible');
            core.info('All criteria met. PR eligible for auto-approval.');

      - name: Resolve approver token state
        id: approver_token_state
        env:
          GOVHUB_APPROVER_TOKEN: ${{ secrets.GOVHUB_APPROVER_TOKEN }}
        run: |
          if [ -n "${GOVHUB_APPROVER_TOKEN:-}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Approve PR
        id: approve_pr
        if: steps.evaluate.outputs.approve == 'true' && steps.approver_token_state.outputs.has_token == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GOVHUB_APPROVER_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              event: 'APPROVE',
              body: 'Auto-approved by governance-bot under GOVHUB policy criteria.'
            });

      - name: Approver token missing notice
        if: steps.evaluate.outputs.approve == 'true' && steps.approver_token_state.outputs.has_token != 'true'
        run: |
          echo "GOVHUB_APPROVER_TOKEN ausente. Sem bot aprovador dedicado, o requisito de review continuara manual."

      - name: Auto-approve skipped notice
        if: steps.evaluate.outputs.approve != 'true'
        run: |
          echo "Auto-approve skipped. reason=${{ steps.evaluate.outputs.reason }}"

      - name: Enable auto-merge (squash) with retry x3
        id: automerge
        if: steps.evaluate.outputs.approve == 'true' || github.event.pull_request.auto_merge != null
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            let pr = await github.rest.pulls.get({ owner, repo, pull_number });
            let enabled = false;
            let lastError = '';

            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const currentMethod = String(pr.data?.auto_merge?.merge_method || '').toUpperCase();
                if (currentMethod && currentMethod !== 'SQUASH') {
                  await github.graphql(
                    `mutation($pullRequestId: ID!) {
                      disablePullRequestAutoMerge(input: {
                        pullRequestId: $pullRequestId
                      }) {
                        pullRequest { number }
                      }
                    }`,
                    { pullRequestId: pr.data.node_id }
                  );
                }

                await github.graphql(
                  `mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: SQUASH
                    }) {
                      pullRequest { number }
                    }
                  }`,
                  { pullRequestId: pr.data.node_id }
                );
                core.info(`Auto-merge enabled on attempt ${attempt}.`);
                enabled = true;
                break;
              } catch (e) {
                lastError = String(e?.message || e);
                if (lastError.toLowerCase().includes('already enabled')) {
                  pr = await github.rest.pulls.get({ owner, repo, pull_number });
                  const method = String(pr.data?.auto_merge?.merge_method || '').toUpperCase();
                  if (method === 'SQUASH') {
                    core.info('Auto-merge already enabled in SQUASH mode.');
                    enabled = true;
                    break;
                  }
                }
                core.warning(`Auto-merge attempt ${attempt} failed: ${lastError}`);
                await new Promise((r) => setTimeout(r, 3000));
                pr = await github.rest.pulls.get({ owner, repo, pull_number });
              }
            }

            core.setOutput('enabled', enabled ? 'true' : 'false');
            core.setOutput('error', lastError);

      - name: Fallback owner_call on auto-merge failure
        if: steps.evaluate.outputs.approve == 'true' && steps.automerge.outputs.enabled != 'true'
        uses: actions/github-script@v7
        env:
          LAST_AUTOMERGE_ERROR: ${{ steps.automerge.outputs.error }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const reason = process.env.LAST_AUTOMERGE_ERROR || 'unknown_error';

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pull_number,
              labels: ['owner-call-required']
            }).catch(() => null);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body:
                'owner_call: auto-merge falhou após 3 tentativas automáticas. ' +
                'Ação do owner é obrigatória para concluir o merge. ' +
                `Motivo técnico: ${reason}`
            });

      - name: Registrar status do bot govhub-approve-br
        if: always() && secrets.GOV_MANAGER_BOT_STATUS_ENDPOINT != '' && secrets.GOV_MANAGER_BOT_STATUS_TOKEN != ''
        env:
          GOV_MANAGER_BOT_STATUS_ENDPOINT: ${{ secrets.GOV_MANAGER_BOT_STATUS_ENDPOINT }}
          GOV_MANAGER_BOT_STATUS_TOKEN: ${{ secrets.GOV_MANAGER_BOT_STATUS_TOKEN }}
          HAS_GOVHUB_APPROVER_TOKEN: ${{ secrets.GOVHUB_APPROVER_TOKEN != '' }}
          EVALUATE_APPROVE: ${{ steps.evaluate.outputs.approve }}
          EVALUATE_REASON: ${{ steps.evaluate.outputs.reason }}
          EVENT_NAME: ${{ steps.evaluate.outputs.event_name }}
          PR_NUMBER: ${{ steps.evaluate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.evaluate.outputs.head_sha }}
          APPROVE_STEP_OUTCOME: ${{ steps.approve_pr.outcome }}
          AUTOMERGE_ENABLED: ${{ steps.automerge.outputs.enabled }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state="skipped"
          message="criterios nao atendidos"
          review_action="SKIPPED"
          merge_action="SKIPPED"

          if [ "$EVALUATE_APPROVE" = "true" ]; then
            state="ok"
            message="auto-approve executado"
            review_action="APPROVED"
            merge_action="ENABLED"
            if [ "$HAS_GOVHUB_APPROVER_TOKEN" != "true" ]; then
              state="blocked"
              message="GOVHUB_APPROVER_TOKEN ausente"
              review_action="SKIPPED"
              merge_action="SKIPPED"
            fi
          fi

          if [ -n "${EVALUATE_REASON:-}" ] && [ "$EVALUATE_REASON" != "eligible" ]; then
            message="$message; reason=$EVALUATE_REASON"
          fi

          if [ -n "${APPROVE_STEP_OUTCOME:-}" ] && [ "$APPROVE_STEP_OUTCOME" != "success" ]; then
            review_action="FAILED"
          fi

          if [ "${AUTOMERGE_ENABLED:-}" != "true" ] && [ "$EVALUATE_APPROVE" = "true" ]; then
            merge_action="FAILED"
          fi

          if [ "$JOB_STATUS" != "success" ]; then
            state="error"
            message="falha no workflow auto-approve"
            if [ "$EVALUATE_APPROVE" = "true" ] && [ "$HAS_GOVHUB_APPROVER_TOKEN" = "true" ]; then
              review_action="FAILED"
            fi
            if [ "$EVALUATE_APPROVE" = "true" ]; then
              merge_action="FAILED"
            fi
          fi

          curl -fsS -X PUT "$GOV_MANAGER_BOT_STATUS_ENDPOINT" \
            -H "content-type: application/json" \
            -H "x-gov-manager-token: $GOV_MANAGER_BOT_STATUS_TOKEN" \
            --data "{\"bot_id\":\"govhub-approve-br\",\"workflow_id\":\"govhub-auto-approve\",\"state\":\"$state\",\"result\":\"$JOB_STATUS\",\"message\":\"$message;event=$EVENT_NAME;pr=$PR_NUMBER;sha=$HEAD_SHA;review_action=$review_action;merge_action=$merge_action\",\"run_id\":\"${{ github.run_id }}\",\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"actor\":\"github-actions\"}" >/dev/null
